<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the player game</title>
    <link rel="stylesheet" href="styles/main.min.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo"></div>
      </nav>
      <h1 class="hero_title">Guess the player</h1>
    </header>
    <div class="container">
      <main>
        <section class="section_hearts">
          <div class="hearts">
            <svg class="heart_icon" data-id="1">
              <use href="./icons/symbol-defs.svg#icon-heart" />
            </svg>
            <svg class="heart_icon" data-id="2">
              <use href="./icons/symbol-defs.svg#icon-heart" />
            </svg>
            <svg class="heart_icon" data-id="3">
              <use href="./icons/symbol-defs.svg#icon-heart" />
            </svg>
            <svg class="heart_icon" data-id="4">
              <use href="./icons/symbol-defs.svg#icon-heart" />
            </svg>
          </div>
        </section>
        <section class="section_letters">
          <div class="letters_container">
            <div class="letter"></div>
            <div class="letter"></div>
            <div class="letter"></div>
            <div class="letter"></div>
            <div class="letter"></div>
          </div>
        </section>
        <section class="section_clue">
          <button class="clue_btn btn">Get a clue</button>
          <div class="clue_container"></div>
        </section>
        <section class="section_keyboard"></section>
      </main>
      <div class="backdrop visually-hidden">
        <div class="backdrop_container">
          <h2 class="backdrop_title">Game Over</h2>
          <button type="submit" class="backdrop_btn">Play again</button>
        </div>
      </div>
      <div class="backdrop-win visually-hidden">
        <div class="backdrop-win_container">
          <h2 class="backdrop-win_title">
            Congratulations!
            You've won the game!
          </h2>
          <button type="submit" class="backdrop-win_btn"> Try another</button>
        </div>
      </div>
    </div>
    <footer></footer>

    <script src="./JS/main.js" type="module"></script>
  </body>
</html>
